name: Bug report (runtime / crash / output quality)
description: Report a runtime crash, hang, OOM, wrong output, or QSA/serve issue in strata-inkling2
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible runtime bugs, crashes, hangs, or incorrect output in `strata-inkling2`.
        For hardware compatibility or benchmark sharing, please post in [GitHub Discussions](https://github.com/Tamanekokko/Strata/discussions/1).
        English and Japanese are both welcome / 日本語での報告も歓迎です。
  - type: input
    id: gpu
    attributes:
      label: GPU model, VRAM, and count
      placeholder: "e.g., 1x RX 9060 XT 16GB (gfx1200)"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: ROCm version, OS, and kernel
      description: Output of `uname -r` and your ROCm version.
      placeholder: "e.g., ROCm 7.x / 10.1.0, Ubuntu 24.04, 6.8.0"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Git commit
      description: Output of `git rev-parse --short HEAD`
      placeholder: "e.g., 7f03946"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model & quantization (and QSA indexer if used)
      placeholder: "e.g., Inkling-2-Mini-UD-Q4_K_M.gguf + inkling2-qsa-indexer-v3.bin"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command & environment variables
      description: Include `HIP_VISIBLE_DEVICES`, `--peer-device`, `--qsa-*`, and any `STRATA_*` env vars.
      render: bash
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened vs. what you expected
      description: Describe the crash, hang, or output anomaly.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste relevant stdout/stderr, HIP errors, or backtraces.
      render: text
    validations:
      required: false
